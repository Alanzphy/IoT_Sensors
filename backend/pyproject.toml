[project]
name = "sensores-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=4.0.1",
    "cryptography>=44.0.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pymysql>=1.1.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "reportlab>=4.4.10",
    "sqlalchemy>=2.0.48",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.4",
]


[tool.ruff]
line-length = 100
target-version = "py313"

# Subset seguro: bugs + imports + sintaxis (E4/E7/E9/F). Reglas de estilo (I, UP, B...) en un cambio futuro.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Los env vars de la suite deben setearse antes de importar la app (Settings se instancia al import).
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
